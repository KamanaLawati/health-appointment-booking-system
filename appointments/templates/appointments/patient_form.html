{% extends "appointments/base.html" %}

{% block content %}

<h1>Register Patient</h1>

<form method="post">
    {% csrf_token %}

    <label>Patient Name</label>
    <input
        type="text"
        name="patient_name"
        required
    >

    <label>Date of Birth</label>
    <input
        type="date"
        name="date_of_birth"
    >

    <label>Gender</label>
    <select name="gender">
        <option value="">Select gender</option>
        <option value="Male">Male</option>
        <option value="Female">Female</option>
        <option value="Other">Other</option>
    </select>

    <label>Email</label>
    <input
        type="email"
        name="email"
        required
    >

    <label>Phone</label>
    <input
        type="text"
        name="phone"
    >

    <label>Address</label>
    <textarea name="address"></textarea>

    <button type="submit">
        Register Patient
    </button>
</form>

{% endblock %}
